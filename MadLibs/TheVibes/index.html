
    <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neras Story Generator</title>
  <!-- Latest compiled and minified CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


  <!-- Your custom CSS - MUST come after Bootstrap -->
  <link href="TheVibes.css" rel="stylesheet" />
</head>

<body>
  <header class="py-5">
    <div class="container text-center text-white">
      <div class="row">
        <div class="col-sm-12">
          <h1>Neras, Hub of Wonders</h1>
        </div>
      </div>
    </div>
  </header>

  <section>
    <div class="text-center">
      <img class="img-fluid rounded-circle hero-image"
        src="//blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhRVXTl4UGWvyQlrWUSyoGB_mc6R2I4cdPXAc16HMxdFIV0IL8DU3hSqWiTZnT0kCbrw0S4kXaV5hOCQPicNenHIjUBCH50IUOdWahy2aJT2ZlDqym5POAAuw5BFEhwp20yu0YS9_5YiA0mhrS-pmaVcn6Oc9shy0U_yCcn2cHpe40IWcK4Dnb1xKEPLbY/s531/Elizabeth_lcon_Alt.png"
        alt="Host, Elizabeth">
    </div>
    <div class="container py-3">
      <div class="row text-center">
        <div class="col-sm-12">
          <h2>Welcome to Neras</h2>
        </div>
      </div>
    </div>
  </section>

  <div class="container py-5 text-center">
    <h1>Explore Our Realm</h1>
    <p>Please fill out the form below to generate your adventure.</p>
    
    <section>
      <div class="form-container">
        <form id="storyForm">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="heroName" class="form-label">Hero's Name</label>
              <input type="text" class="form-control" id="heroName" placeholder="Enter hero's name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="sidekickName" class="form-label">Sidekick's Name</label>
              <input type="text" class="form-control" id="sidekickName" placeholder="Enter sidekick's name" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="heroTrait" class="form-label">Hero's Best Trait</label>
              <input type="text" class="form-control" id="heroTrait" placeholder="e.g., brave, clever, kind" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="magicalItem" class="form-label">Magical Item</label>
              <input type="text" class="form-control" id="magicalItem" placeholder="e.g., enchanted sword, crystal"
                required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="villainName" class="form-label">Villain's Name</label>
              <input type="text" class="form-control" id="villainName" placeholder="Enter villain's name" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="kingdom" class="form-label">Kingdom Name</label>
              <input type="text" class="form-control" id="kingdom" placeholder="Enter kingdom name" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="quest" class="form-label">Quest Objective</label>
              <input type="text" class="form-control" id="quest" placeholder="e.g., save the princess, find treasure"
                required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="obstacle" class="form-label">Main Obstacle</label>
              <input type="text" class="form-control" id="obstacle" placeholder="e.g., dark forest, dragon" required>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="reward" class="form-label">Final Reward</label>
              <input type="text" class="form-control" id="reward" placeholder="e.g., golden crown, eternal peace"
                required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="creature" class="form-label">Mystical Creature</label>
              <input type="text" class="form-control" id="creature" placeholder="e.g., phoenix, unicorn, dragon"
                required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Story Tone</label>
            <select class="form-select" id="storyTone" required>
              <option value="">Choose a tone...</option>
              <option value="epic">Epic & Heroic</option>
              <option value="mysterious">Dark & Mysterious</option>
              <option value="lighthearted">Lighthearted & Fun</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Time of Day</label>
            <div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="timeOfDay" id="dawn" value="dawn" required>
                <label class="form-check-label" for="dawn">Dawn</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="timeOfDay" id="midday" value="midday">
                <label class="form-check-label" for="midday">Midday</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="timeOfDay" id="dusk" value="dusk">
                <label class="form-check-label" for="dusk">Dusk</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="timeOfDay" id="midnight" value="midnight">
                <label class="form-check-label" for="midnight">Midnight</label>
              </div>
            </div>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">Generate My Story!</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Story Display Section -->
    <section class="mt-4">
      <div class="story-container" id="storyDisplay">
        <h2 class="story-title">Your Adventure</h2>
        <div id="storyContent" class="story-content"></div>
      </div>
    </section>
  </div>

  <footer>
    <div class="container text-center text-white">
      <div class="row">
        <div class="col-sm-12">
          <div class="social-links">
            <a href="https://www.instagram.com/lynirispxce_" target="_blank" aria-label="Instagram"><i
                class="fa fa-instagram"></i></a>
            <a href="https://www.tumblr.com/malthus-obsession-page" target="_blank" aria-label="Tumblr"><i
                class="fa fa-tumblr-square"></i></a>
            <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook"><i
                class="fa fa-facebook-square"></i></a>
          </div>

          <p class="footer-copyright">
            Safe Travels, dear friend.
          </p>
        </div>
      </div>
    </div>
  </footer>


</body>

</html>

    <!-- Latest Javascript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="TheVibes.js"></script>

</body>
</html>
